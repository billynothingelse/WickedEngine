name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Bootstrap and build (Development)
      shell: cmd
      run: bootstrap.bat Development
    - name: Build (Shipping)
      shell: cmd
      run: bootstrap.bat Shipping

  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev
    - name: Bootstrap and build (Development)
      run: ./bootstrap.sh development
    - name: Build (Shipping)
      run: ./bootstrap.sh shipping
